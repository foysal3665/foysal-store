<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z E N V Y | Premium Luxury Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALuGjVy2_L-ufS785MzFPmde0Po2HTxD8",
            authDomain: "foysal-store.firebaseapp.com",
            projectId: "foysal-store",
            storageBucket: "foysal-store.firebasestorage.app",
            messagingSenderId: "509319347526",
            appId: "1:509319347526:web:7958b038fc9b2ad1953947",
            databaseURL: "https://foysal-store-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getDatabase(app);
        window.dbRef = ref; window.dbPush = push; window.dbSet = set; window.dbOnValue = onValue; window.dbRemove = remove;
        
        setTimeout(() => { initZenvy(); }, 500);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Hind+Siliguri:wght@400;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; 
            margin: 0;
            background: #000 url('bg.png') no-repeat center center fixed; /* আপনার আপলোড করা ছবি */
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
        }

        .glass-nav { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .product-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            transition: 0.3s ease; 
        }
        .product-card:hover { transform: translateY(-5px); border-color: #0ea5e9; }
        .cart-drawer { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .cat-btn-active { background: #4db8ff !important; color: #000 !important; }
        .loader { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #4db8ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-900">

    <!-- Navbar -->
    <nav class="glass-nav sticky top-0 z-50 py-2.5 px-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <!-- ZV Logo SVG (Built-in) -->
            <div class="w-10 h-10 rounded-xl bg-black flex items-center justify-center border border-sky-400 shadow-lg shrink-0">
                <svg viewBox="0 0 100 100" class="w-7 h-7">
                    <path d="M25 35H75L25 65H75" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M35 45L50 75L75 30" stroke="#4db8ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <h1 class="text-base font-extrabold tracking-[2px] text-white uppercase">Z E N V Y</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="window.toggleCart(true)" class="relative w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white">
                <i class="fas fa-shopping-bag text-sm"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-sky-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="window.openProfile()" class="w-9 h-9 rounded-full bg-white/10 border border-white/20 overflow-hidden flex items-center justify-center text-slate-300">
                <img id="nav-user-img" src="" class="w-full h-full object-cover hidden">
                <i id="nav-user-icon" class="fas fa-user text-xs"></i>
            </button>
        </div>
    </nav>

    <!-- UI View -->
    <div id="user-view">
        <header class="py-20 px-6 text-center">
            <h1 class="text-4xl md:text-7xl font-bold italic mb-2 uppercase tracking-tighter text-white">Elite Luxe</h1>
            <p class="text-sky-400 text-[10px] font-bold uppercase tracking-[6px] mb-4">Z E N V Y</p>
            <p class="text-slate-400 text-[10px] md:text-sm max-w-xs mx-auto opacity-70">Experience luxury at your fingertips.</p>
        </header>

        <div class="container mx-auto px-4 space-y-6 text-center">
            <input type="text" id="user-search" oninput="window.searchProduct()" placeholder="Search luxury items..." class="max-w-md w-full px-5 py-3 bg-white/5 border border-white/10 rounded-2xl outline-none text-xs text-white focus:ring-1 ring-sky-500 transition">
            
            <div class="flex justify-center gap-2 overflow-x-auto no-scrollbar pb-2 px-2">
                <button onclick="window.filterCat('All')" class="cat-btn px-5 py-2 rounded-full border border-white/10 text-white text-[9px] font-bold uppercase tracking-widest transition cat-btn-active" data-cat="All">All</button>
                <button onclick="window.filterCat('Clothing')" class="cat-btn px-5 py-2 rounded-full border border-white/10 text-white text-[9px] font-bold uppercase tracking-widest transition" data-cat="Clothing">Clothing</button>
                <button onclick="window.filterCat('Bracelets')" class="cat-btn px-5 py-2 rounded-full border border-white/10 text-white text-[9px] font-bold uppercase tracking-widest transition" data-cat="Bracelets">Bracelets</button>
                <button onclick="window.filterCat('Chain')" class="cat-btn px-5 py-2 rounded-full border border-white/10 text-white text-[9px] font-bold uppercase tracking-widest transition" data-cat="Chain">Chain</button>
                <button onclick="window.filterCat('Cosmetics')" class="cat-btn px-5 py-2 rounded-full border border-white/10 text-white text-[9px] font-bold uppercase tracking-widest transition" data-cat="Cosmetics">Cosmetics</button>
            </div>
        </div>

        <main class="container mx-auto px-3 py-10 min-h-[400px]">
            <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
                <div class="loader mb-4"></div>
            </div>
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 hidden"></div>
        </main>
        
        <footer class="py-16 text-center border-t border-white/5">
            <h2 class="text-lg font-black tracking-[4px] text-white mb-4 uppercase">Z E N V Y</h2>
            <button onclick="window.openLoginModal()" class="text-[9px] text-slate-500 font-bold uppercase tracking-[2px] hover:text-sky-500 transition">Admin Console</button>
        </footer>
    </div>

    <!-- Modals (Cart, Profile, Order, Login) -->
    <div id="cart-drawer" class="fixed inset-0 z-[100] hidden">
        <div onclick="window.toggleCart(false)" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-[320px] bg-[#0f172a] text-white shadow-2xl flex flex-col translate-x-full cart-drawer" id="cart-panel">
            <div class="p-5 border-b border-white/10 flex justify-between items-center"><h2 class="font-bold uppercase tracking-widest text-[10px]">Your Bag</h2><button onclick="window.toggleCart(false)" class="text-slate-400 text-xl">&times;</button></div>
            <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
            <div class="p-5 border-t border-white/10 bg-white/5 space-y-4"><div class="flex justify-between font-bold text-sm"><span>Total</span><span class="text-sky-400">৳<span id="cart-total-price">0</span></span></div><button onclick="window.openCheckout()" class="w-full bg-white text-black py-4 rounded-xl font-bold text-[10px] uppercase shadow-lg">Checkout Now</button></div>
        </div>
    </div>

    <!-- JavaScript logic remains exactly as our last "Cart Fix" version -->
    <script>
        const MASTER_PASS = "Foysal12@#", WHATSAPP = "8801963792670";
        let storeData = {}, cart = JSON.parse(localStorage.getItem('zenvy_bag_v1')) || [], editingKey = null, currentCat = 'All';

        function initZenvy() {
            if(!window.dbOnValue) return;
            const ref = window.dbRef(window.firebaseDB, 'global_products');
            window.dbOnValue(ref, (snap) => {
                storeData = snap.val() || {};
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('product-grid').classList.remove('hidden');
                applyFilter();
                renderAdminList(storeData);
            });
            updateCartCount();
            updateProfileUI();
        }

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = Object.keys(data).map(key => {
                const p = data[key];
                return `<div class="product-card p-2 text-center flex flex-col justify-between group">
                    <div class="relative overflow-hidden rounded-xl mb-2.5 shadow-sm">
                        <img src="${p.img}" class="w-full h-28 md:h-40 object-cover transition duration-500 group-hover:scale-110">
                        <span class="absolute top-1 right-1 bg-black/60 text-white text-[6px] px-1.5 py-0.5 rounded-full uppercase font-bold">${p.category || 'Elite'}</span>
                    </div>
                    <p class="text-[7px] text-slate-300 font-bold uppercase truncate px-1">${p.name}</p>
                    <p class="text-sky-400 font-extrabold text-[10px] mb-2 italic">৳${p.price}</p>
                    <button onclick="window.addToCart('${key}')" class="w-full bg-white/10 text-white text-[8px] py-2 rounded-lg font-bold uppercase active:scale-95 transition border border-white/5">Add to bag</button>
                </div>`;
            }).join('');
        }

        window.toggleCart = (s) => { const d = document.getElementById('cart-drawer'), p = document.getElementById('cart-panel'); if(s) { d.classList.remove('hidden'); setTimeout(() => p.classList.remove('translate-x-full'), 10); } else { p.classList.add('translate-x-full'); setTimeout(() => d.classList.add('hidden'), 400); } renderCart(); }
        window.addToCart = (k) => { const p = storeData[k], e = cart.find(i => i.key === k); if(e) e.qty++; else cart.push({ key: k, name: p.name, price: p.price, img: p.img, qty: 1 }); saveCart(); updateCartCount(); window.toggleCart(true); }
        window.updateQty = (i, d) => { cart[i].qty += d; if(cart[i].qty < 1) cart.splice(i, 1); saveCart(); renderCart(); updateCartCount(); }
        function renderCart() { const l = document.getElementById('cart-items-list'), t = document.getElementById('cart-total-price'); let tt = 0; l.innerHTML = cart.map((item, idx) => { tt += item.price * item.qty; return `<div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10 shadow-sm"><img src="${item.img}" class="w-10 h-10 rounded-lg object-cover shadow-sm"><div class="flex-1 min-w-0"><p class="text-[9px] font-bold truncate text-white">${item.name}</p><p class="text-sky-400 font-bold text-[10px]">৳${item.price}</p></div><div class="flex items-center gap-2"><button onclick="window.updateQty(${idx}, -1)" class="w-5 h-5 bg-white/10 border border-white/10 rounded text-xs text-white">-</button><span class="text-[10px] font-bold text-white">${item.qty}</span><button onclick="window.updateQty(${idx}, 1)" class="w-5 h-5 bg-white/10 border border-white/10 rounded text-xs text-white">+</button></div></div>`; }).join(''); if(cart.length === 0) l.innerHTML = `<p class="text-center text-slate-500 text-[10px] py-10 uppercase tracking-widest italic">Bag is empty</p>`; t.innerText = tt; }
        function saveCart() { localStorage.setItem('zenvy_bag_v1', JSON.stringify(cart)); }
        function updateCartCount() { document.getElementById('cart-count').innerText = cart.length; }

        window.openCheckout = () => { if(cart.length === 0) return alert("Bag is empty!"); toggleCart(false); const s = document.getElementById('order-summary-box'); let tt = 0; s.innerHTML = cart.map(i => { tt += i.price * i.qty; return `<div class="flex justify-between border-b border-white/5 pb-1 text-white"><span>${i.name} (x${i.qty})</span><span>৳${i.price * i.qty}</span></div>`; }).join(''); s.innerHTML += `<div class="flex justify-between font-black text-sky-400 pt-2 uppercase text-xs"><span>Total:</span><span>৳${tt}</span></div>`; document.getElementById('order-modal').classList.remove('hidden'); }
        window.confirmWhatsApp = () => { const n = document.getElementById('c-name').value.trim(), a = document.getElementById('c-addr').value.trim(), ph = document.getElementById('c-phone').value.trim(); if(!n || !a || !ph) return alert("Fill form!"); let t = cart.map(i => `- ${i.name} (x${i.qty}) = ৳${i.price * i.qty}`).join('\n'), tt = cart.reduce((s, i) => s + (i.price * i.qty), 0); const msg = `নতুন অর্ডার (Z E N V Y)!\n\n*লিস্ট:*\n${t}\n\n*মোট দাম: ৳${tt}*\n\n-- কাস্টমার --\nনাম: ${n}\nঠিকানা: ${a}\nমোবাইল: ${ph}`; window.location.href = `https://api.whatsapp.com/send?phone=${WHATSAPP}&text=${encodeURIComponent(msg)}`; cart = []; saveCart(); updateCartCount(); closeModal(); }

        window.filterCat = (cat) => { currentCat = cat; document.querySelectorAll('.cat-btn').forEach(btn => { if(btn.dataset.cat === cat) btn.classList.add('cat-btn-active'); else btn.classList.remove('cat-btn-active'); }); applyFilter(); }
        function applyFilter() { const f = {}; const q = document.getElementById('user-search').value.toLowerCase(); Object.keys(storeData).forEach(k => { const p = storeData[k]; if((currentCat === 'All' || p.category === currentCat) && p.name.toLowerCase().includes(q)) f[k] = p; }); renderProducts(f); }
        window.searchProduct = applyFilter;
        window.renderAdminList = (d) => { const l = document.getElementById('admin-product-list'); l.innerHTML = Object.keys(d).map(k => `<div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5 mb-2"><div class="flex items-center gap-3"><img src="${d[k].img}" class="w-8 h-8 rounded object-cover border"><div class="text-left text-[9px] font-bold uppercase text-slate-300">${d[k].name}</div></div><div class="flex gap-2"><button onclick="window.editProduct('${k}')" class="text-blue-400 px-2"><i class="fas fa-edit"></i></button><button onclick="window.removeProduct('${k}')" class="text-red-400 px-2"><i class="fas fa-trash-alt"></i></button></div></div>`).join(''); }
        window.saveToCloud = () => { const n = document.getElementById('p-name').value, p = document.getElementById('p-price').value, c = document.getElementById('p-cat-select').value, d = document.getElementById('p-desc').value, f = document.getElementById('p-image-file').files[0], btn = document.getElementById('save-btn'); if(!n || !p) return alert("Fill form!"); btn.innerText = "Syncing..."; const proc = (img) => { const o = { name: n, price: Number(p), category: c, desc: d, img: img || (editingKey ? storeData[editingKey].img : "") }; if(editingKey) window.dbSet(window.dbRef(window.firebaseDB, 'global_products/' + editingKey), o); else window.dbPush(window.dbRef(window.firebaseDB, 'global_products'), o); cancelEdit(); }; if(f) { const r = new FileReader(); r.onload = () => proc(r.result); r.readAsDataURL(f); } else proc(); }
        window.editProduct = (k) => { editingKey = k; const p = storeData[k]; document.getElementById('p-name').value = p.name; document.getElementById('p-price').value = p.price; document.getElementById('p-cat-select').value = p.category || "Clothing"; document.getElementById('p-desc').value = p.desc || ""; document.getElementById('admin-form-title').innerText = "Edit Mode"; document.getElementById('save-btn').innerText = "Update"; document.getElementById('cancel-edit-btn').classList.remove('hidden'); }
        window.cancelEdit = () => { editingKey = null; document.getElementById('p-name').value = ""; document.getElementById('p-price').value = ""; document.getElementById('p-desc').value = ""; document.getElementById('admin-form-title').innerText = "Add New Item"; document.getElementById('save-btn').innerText = "Publish"; document.getElementById('cancel-edit-btn').classList.add('hidden'); }
        window.removeProduct = (k) => { if(confirm("Delete item?")) window.dbRemove(window.dbRef(window.firebaseDB, 'global_products/' + k)); }
        window.openLoginModal = () => document.getElementById('admin-login-modal').classList.remove('hidden');
        window.handleLogin = () => { if(document.getElementById('admin-pass-input').value === MASTER_PASS) { document.getElementById('admin-login-modal').classList.add('hidden'); document.getElementById('user-view').classList.add('hidden'); document.getElementById('admin-dashboard-view').classList.remove('hidden'); } else alert("DENIED"); }
        window.exitDashboard = () => location.reload();
        window.closeModal = () => document.getElementById('order-modal').classList.add('hidden');
        window.openProfile = () => { const d = JSON.parse(localStorage.getItem('zenvy_user_profile')) || {}; document.getElementById('u-name').value = d.name || ""; document.getElementById('u-phone').value = d.phone || ""; document.getElementById('u-addr').value = d.addr || ""; if(d.img) { document.getElementById('u-preview-img').src = d.img; document.getElementById('u-preview-img').classList.remove('hidden'); document.getElementById('u-placeholder').classList.add('hidden'); } document.getElementById('profile-modal').classList.remove('hidden'); }
        window.closeProfile = () => document.getElementById('profile-modal').classList.add('hidden');
        window.previewUserImg = (e) => { const r = new FileReader(); r.onload = () => { document.getElementById('u-preview-img').src = r.result; document.getElementById('u-preview-img').classList.remove('hidden'); document.getElementById('u-placeholder').classList.add('hidden'); }; r.readAsDataURL(e.target.files[0]); }
        window.saveUserProfile = () => { const o = { name: document.getElementById('u-name').value, phone: document.getElementById('u-phone').value, addr: document.getElementById('u-addr').value, img: document.getElementById('u-preview-img').src }; localStorage.setItem('zenvy_user_profile', JSON.stringify(o)); updateProfileUI(); alert("Saved!"); closeProfile(); }
        function updateProfileUI() { const d = JSON.parse(localStorage.getItem('zenvy_user_profile')) || {}; if(d.img && d.img.startsWith('data:image')) { document.getElementById('nav-user-img').src = d.img; document.getElementById('nav-user-img').classList.remove('hidden'); document.getElementById('nav-user-icon').classList.add('hidden'); } document.getElementById('c-name').value = d.name || ""; document.getElementById('c-phone').value = d.phone || ""; document.getElementById('c-addr').value = d.addr || ""; }
    </script>

    <!-- Modals Body -->
    <div id="order-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-[110] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#0f172a] text-white w-full max-w-md rounded-t-[40px] sm:rounded-[35px] p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
            <button onclick="window.closeModal()" class="float-right text-slate-500 text-2xl">&times;</button>
            <h3 class="font-black text-xl mb-8 uppercase tracking-tighter text-sky-400 italic">Order Form</h3>
            <div id="order-summary-box" class="mb-8 p-5 bg-white/5 rounded-[30px] flex flex-col gap-2 border border-white/10 shadow-inner"></div>
            <div class="space-y-4">
                <input type="text" id="c-name" placeholder="আপনার নাম" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none">
                <input type="text" id="c-addr" placeholder="ঠিকানা" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none">
                <input type="number" id="c-phone" placeholder="মোবাইল" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none">
                <button onclick="window.confirmWhatsApp()" class="w-full bg-[#25D366] text-white py-5 rounded-3xl font-black flex items-center justify-center gap-4 text-xl shadow-2xl">Confirm Order</button>
            </div>
        </div>
    </div>
</body>
</html>
