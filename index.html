            <input type="password" id="admin-pass-input" placeholder="••••" class="w-full p-5 bg-white/5 border border-white/10 rounded-2xl mb-8 outline-none text-center font-bold tracking-[1em] focus:ring-1 ring-sky-500 text-white">
            <button onclick="window.handleLogin()" class="w-full bg-sky-500 text-black py-4 rounded-xl font-black uppercase text-xs">Verify</button>

    <div id="admin-dashboard-view" class="hidden min-h-screen bg-black">
        <div class="glass-nav p-5 flex justify-between items-center"><h2 class="text-[10px] font-black uppercase text-sky-400 italic">Inventory Pro</h2><button onclick="window.exitDashboard()" class="bg-red-500/20 text-red-500 px-6 py-2 rounded-2xl text-[9px] font-bold uppercase border border-red-500/30">Exit</button></div>
        <div class="container mx-auto px-4 py-10 max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-10">
            <div class="bg-white/5 p-8 rounded-[40px] border border-white/5 shadow-2xl h-fit">
                <h3 id="admin-form-title" class="text-[10px] font-black text-slate-400 uppercase mb-8 border-b border-white/5 pb-2">Add Elite Item</h3>
                <input type="text" id="p-name" placeholder="Item Name" class="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 text-white"><input type="number" id="p-price" placeholder="Price" class="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 text-white"><select id="p-cat-select" class="w-full p-4 bg-black border border-white/10 rounded-xl mb-4 text-white text-xs"><option value="Clothing">Clothing</option><option value="Bracelets">Bracelets</option><option value="Chain">Chain</option><option value="Cosmetics">Cosmetics</option></select><textarea id="p-desc" placeholder="Product Details..." class="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 text-white text-xs h-24 no-scrollbar"></textarea><input type="file" id="p-image-file" accept="image/*" class="w-full p-4 bg-white/5 border border-dashed border-white/10 rounded-xl text-[10px] text-slate-500 mb-8">

            </div>
            <div class="md:col-span-2 bg-white/5 p-8 rounded-[40px] border border-white/5 shadow-2xl h-[700px] overflow-y-auto no-scrollbar"><div id="admin-product-list" class="space-y-4"></div></div>

            <h2 class="text-xl font-black mb-8 text-sky-400 italic uppercase tracking-tighter">My Identity</h2>
            <div class="space-y-5">
                <label for="u-img-input" class="inline-block relative w-28 h-24 rounded-[2.5rem] border-2 border-sky-400 p-1 cursor-pointer bg-white/5 shadow-2xl">
                    <img id="u-preview-img" src="" class="w-full h-full rounded-[2.2rem] object-cover hidden shadow-inner"><div id="u-placeholder" class="w-full h-full flex items-center justify-center text-sky-400"><i class="fas fa-camera text-2xl"></i></div><input type="file" id="u-img-input" accept="image/*" class="hidden" onchange="window.previewUserImg(event)">
                </label>
                <input type="text" id="u-name" placeholder="Full Name" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none"><input type="number" id="u-phone" placeholder="WhatsApp Number" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none"><textarea id="u-addr" placeholder="Address" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-white outline-none h-24"></textarea>
                <button onclick="window.saveUserProfile()" class="w-full bg-white text-black py-4 rounded-3xl font-black uppercase text-xs shadow-[0_0_30px_white]">Confirm Identity</button>
            </div>
        </div>

    <script>
        const MASTER_PASS = "Foysal12@#", WHATSAPP = "8801963792670";
        let storeData = {}, cart = JSON.parse(localStorage.getItem('zenvy_bag_v1')) || [], editingKey = null, currentCat = 'All';

        function initZenvy() {
            if(!window.dbOnValue) return;
            window.dbOnValue(window.dbRef(window.firebaseDB, 'global_products'), (snap) => {
                storeData = snap.val() || {};
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('product-grid').classList.remove('hidden');
                applyFilter(); renderAdminList(storeData);
            });
            updateCartCount(); updateProfileUI();
        }

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = Object.keys(data).map(key => {
                const p = data[key];
                return `<div class="product-card p-4 text-center flex flex-col justify-between group">
                    <div onclick="window.openDetails('${key}')" class="relative overflow-hidden rounded-[20px] mb-4 cursor-pointer shadow-2xl border border-white/5">
                        <img src="${p.img}" class="w-full h-32 md:h-48 object-cover transition-transform duration-700 group-hover:scale-110">
                        <span class="absolute top-2 left-2 badge-premium">Elite</span>
                    </div>
                    <div onclick="window.openDetails('${key}')" class="cursor-pointer mb-2">
                        <p class="text-[9px] text-slate-400 font-bold uppercase truncate px-1 tracking-widest">${p.name}</p>
                        <p class="text-sky-400 font-black text-lg italic tracking-tighter">৳${p.price}</p>
                    </div>
                    <button onclick="window.addToCart('${key}')" class="w-full bg-white/10 text-white text-[9px] py-3 rounded-2xl font-black uppercase active:scale-95 transition border border-white/5 hover:bg-white hover:text-black shadow-xl">Add to bag</button>
                </div>`;
            }).join('');
        }

        window.openDetails = (key) => {
            const p = storeData[key];
            document.getElementById('details-content').innerHTML = `
                <img src="${p.img}" class="w-full h-80 object-cover shadow-2xl border-b border-white/5">
                <div class="p-8 space-y-6">
                    <div class="flex justify-between items-start">
                        <div><span class="text-sky-400 text-[10px] font-black uppercase tracking-[3px] italic">${p.category || 'Luxury'}</span><h2 class="text-3xl font-black text-white italic tracking-tighter uppercase">${p.name}</h2></div>
                        <p class="text-2xl font-black text-sky-400 italic">৳${p.price}</p>
                    </div>
                    <div class="h-[1px] w-full bg-white/10 shadow-lg"></div>
                    <p class="text-slate-400 text-xs leading-relaxed max-h-32 overflow-y-auto no-scrollbar font-light tracking-wide">${p.desc || 'Contact Z E N V Y directly for premium inquiry of this curated piece.'}</p>
                    <div class="flex gap-2">
                        <div class="flex-1 border border-white/10 rounded-2xl p-3 flex flex-col items-center"><i class="fas fa-truck text-sky-400 mb-1"></i><span class="text-[8px] uppercase font-bold text-slate-500">Fast Shipping</span></div>
                        <div class="flex-1 border border-white/10 rounded-2xl p-3 flex flex-col items-center"><i class="fas fa-shield-alt text-sky-400 mb-1"></i><span class="text-[8px] uppercase font-bold text-slate-500">Safe Payment</span></div>
                    </div>
                    <button onclick="window.addToCart('${key}'); closeDetails();" class="w-full bg-white text-black py-5 rounded-[2rem] font-black uppercase text-[10px] shadow-[0_0_30px_white] active:scale-95 transition">Add To Bag</button>
                </div>`;
            document.getElementById('details-modal').classList.remove('hidden');
        }
        window.closeDetails = () => document.getElementById('details-modal').classList.add('hidden');

        // Logic sync (Filter, Cart, Admin)
        window.filterCat = (c) => { currentCat = c; document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('cat-btn-active', b.dataset.cat === c)); applyFilter(); }
        function applyFilter() { const f = {}, q = document.getElementById('user-search').value.toLowerCase(); Object.keys(storeData).forEach(k => { const p = storeData[k]; if((currentCat === 'All' || p.category === currentCat) && p.name.toLowerCase().includes(q)) f[k] = p; }); renderProducts(f); }
        window.toggleCart = (s) => { const d = document.getElementById('cart-drawer'), p = document.getElementById('cart-panel'); if(s) { d.classList.remove('hidden'); setTimeout(() => p.classList.remove('translate-x-full'), 10); } else { p.classList.add('translate-x-full'); setTimeout(() => d.classList.add('hidden'), 400); } renderCart(); }
        window.addToCart = (k) => { const p = storeData[k], e = cart.find(i => i.key === k); if(e) e.qty++; else cart.push({ key: k, name: p.name, price: p.price, img: p.img, qty: 1 }); saveCart(); updateCartCount(); window.toggleCart(true); }
        window.updateQty = (i, d) => { cart[i].qty += d; if(cart[i].qty < 1) cart.splice(i, 1); saveCart(); renderCart(); updateCartCount(); }
        function renderCart() { const l = document.getElementById('cart-items-list'), t = document.getElementById('cart-total-price'); let tt = 0; l.innerHTML = cart.map((item, idx) => { tt += item.price * item.qty; return `<div class="flex items-center gap-4 p-4 bg-white/5 rounded-3xl border border-white/5 shadow-2xl"><img src="${item.img}" class="w-14 h-14 rounded-2xl object-cover shadow-lg border border-white/10"><div class="flex-1 min-w-0"><p class="text-[10px] font-bold truncate text-white uppercase">${item.name}</p><p class="text-sky-400 font-black text-sm italic">৳${item.price}</p></div><div class="flex items-center gap-2 bg-black/40 rounded-xl p-1"><button onclick="window.updateQty(${idx}, -1)" class="w-6 h-6 rounded-lg bg-white/10 text-white text-xs">-</button><span class="text-[10px] font-bold w-4 text-center">${item.qty}</span><button onclick="window.updateQty(${idx}, 1)" class="w-6 h-6 rounded-lg bg-white/10 text-white text-xs">+</button></div></div>`; }).join(''); if(cart.length === 0) l.innerHTML = `<p class="text-center text-slate-500 text-[10px] py-16 uppercase tracking-[4px] italic">Bag is empty</p>`; t.innerText = tt; }
        function saveCart() { localStorage.setItem('zenvy_bag_v1', JSON.stringify(cart)); }
        function updateCartCount() { document.getElementById('cart-count').innerText = cart.length; }
        window.openCheckout = () => { if(cart.length === 0) return alert("Empty Bag!"); window.toggleCart(false); const s = document.getElementById('order-summary-box'); let tt = 0; s.innerHTML = cart.map(i => { tt += i.price * i.qty; return `<div class="flex justify-between border-b border-white/5 pb-2 text-[10px] font-bold text-slate-400 italic"><span>${i.name} (${i.qty})</span><span>৳${i.price * i.qty}</span></div>`; }).join(''); s.innerHTML += `<div class="flex justify-between font-black text-sky-400 pt-4 uppercase text-sm tracking-tighter"><span>Total:</span><span>৳${tt}</span></div>`; document.getElementById('order-modal').classList.remove('hidden'); }
        window.confirmWhatsApp = () => { const n = document.getElementById('c-name').value.trim(), a = document.getElementById('c-addr').value.trim(), ph = document.getElementById('c-phone').value.trim(); if(!n || !a || !ph) return alert("Fill Profile Details!"); let t = cart.map(i => `- ${i.name} (x${i.qty}) = ৳${i.price * i.qty}`).join('\n'), tt = cart.reduce((s, i) => s + (i.price * i.qty), 0); const msg = `আসসালামু আলাইকুম Z E N V Y!\n\n*Elite Bag:*\n${t}\n\n*Grand Total: ৳${tt}*\n\n-- Customer Identity --\nName: ${n}\nAddress: ${a}\nMobile: ${ph}`; window.location.href = `https://api.whatsapp.com/send?phone=${WHATSAPP}&text=${encodeURIComponent(msg)}`; cart = []; saveCart(); updateCartCount(); window.closeModal(); }
        window.searchProduct = applyFilter;
        window.renderAdminList = (d) => { const l = document.getElementById('admin-product-list'); l.innerHTML = Object.keys(d).map(k => `<div class="flex justify-between items-center p-4 bg-white/5 rounded-[2rem] border border-white/5 mb-2 shadow-2xl"><div class="flex items-center gap-4"><img src="${d[k].img}" class="w-16 h-16 rounded-2xl object-cover border-2 border-white/10 shadow-lg"><div class="text-left text-[10px] font-bold uppercase text-white tracking-widest">${d[k].name}<p class="text-sky-400 italic text-[8px] tracking-normal">${d[k].category}</p></div></div><div class="flex gap-2"><button onclick="window.editProduct('${k}')" class="text-sky-400 px-3 py-3 bg-white/5 rounded-2xl hover:scale-110"><i class="fas fa-pen-nib"></i></button><button onclick="window.removeProduct('${k}')" class="text-red-500 px-3 py-3 bg-white/5 rounded-2xl hover:scale-110"><i class="fas fa-trash-alt"></i></button></div></div>`).join(''); }
        window.saveToCloud = () => { const n = document.getElementById('p-name').value, p = document.getElementById('p-price').value, c = document.getElementById('p-cat-select').value, d = document.getElementById('p-desc').value, f = document.getElementById('p-image-file').files[0], btn = document.getElementById('save-btn'); if(!n || !p) return alert("All fields required"); btn.innerText = "Processing..."; const proc = (img) => { const o = { name: n, price: Number(p), category: c, desc: d, img: img || (editingKey ? storeData[editingKey].img : "") }; if(editingKey) window.dbSet(window.dbRef(window.firebaseDB, 'global_products/' + editingKey), o); else window.dbPush(window.dbRef(window.firebaseDB, 'global_products'), o); window.cancelEdit(); }; if(f) { const r = new FileReader(); r.onload = () => proc(r.result); r.readAsDataURL(f); } else proc(); }
        window.editProduct = (k) => { editingKey = k; const p = storeData[k]; document.getElementById('p-name').value = p.name; document.getElementById('p-price').value = p.price; document.getElementById('p-cat-select').value = p.category; document.getElementById('p-desc').value = p.desc || ""; document.getElementById('admin-form-title').innerText = "Edit Identity"; document.getElementById('save-btn').innerText = "Confirm Update"; document.getElementById('cancel-edit-btn').classList.remove('hidden'); }
        window.cancelEdit = () => { editingKey = null; document.getElementById('p-name').value = ""; document.getElementById('p-price').value = ""; document.getElementById('p-desc').value = ""; document.getElementById('admin-form-title').innerText = "Add Elite Item"; document.getElementById('save-btn').innerText = "Publish Globally"; document.getElementById('cancel-edit-btn').classList.add('hidden'); }
        window.removeProduct = (k) => { if(confirm("Delete item?")) window.dbRemove(window.dbRef(window.firebaseDB, 'global_products/' + k)); }
        window.openLoginModal = () => document.getElementById('admin-login-modal').classList.remove('hidden');
        window.handleLogin = () => { if(document.getElementById('admin-pass-input').value === MASTER_PASS) { document.getElementById('admin-login-modal').classList.add('hidden'); document.getElementById('user-view').classList.add('hidden'); document.getElementById('admin-dashboard-view').classList.remove('hidden'); } else alert("Access Denied"); }
        window.exitDashboard = () => location.reload();
        window.closeModal = () => document.getElementById('order-modal').classList.add('hidden');
        window.openProfile = () => { const d = JSON.parse(localStorage.getItem('zenvy_user_profile')) || {}; document.getElementById('u-name').value = d.name || ""; document.getElementById('u-phone').value = d.phone || ""; document.getElementById('u-addr').value = d.addr || ""; if(d.img) { document.getElementById('u-preview-img').src = d.img; document.getElementById('u-preview-img').classList.remove('hidden'); document.getElementById('u-placeholder').classList.add('hidden'); } document.getElementById('profile-modal').classList.remove('hidden'); }
        window.closeProfile = () => document.getElementById('profile-modal').classList.add('hidden');
        window.previewUserImg = (e) => { const r = new FileReader(); r.onload = () => { document.getElementById('u-preview-img').src = r.result; document.getElementById('u-preview-img').classList.remove('hidden'); document.getElementById('u-placeholder').classList.add('hidden'); }; r.readAsDataURL(e.target.files[0]); }
        window.saveUserProfile = () => { const o = { name: document.getElementById('u-name').value, phone: document.getElementById('u-phone').value, addr: document.getElementById('u-addr').value, img: document.getElementById('u-preview-img').src }; localStorage.setItem('zenvy_user_profile', JSON.stringify(o)); updateProfileUI(); alert("Identity Confirmed!"); window.closeProfile(); }
        function updateProfileUI() { 
            const d = JSON.parse(localStorage.getItem('zenvy_user_profile')) || {}; 
            if(d.img && d.img.startsWith('data:image')) { document.getElementById('nav-user-img').src = d.img; document.getElementById('nav-user-img').classList.remove('hidden'); document.getElementById('nav-user-icon').classList.add('hidden'); } 
            document.getElementById('welcome-text').innerText = d.name ? `Welcome, ${d.name}` : "Premium Store";
            document.getElementById('c-name').value = d.name || ""; document.getElementById('c-phone').value = d.phone || ""; document.getElementById('c-addr').value = d.addr || ""; 
        }
    </script>
</body>
</html>
